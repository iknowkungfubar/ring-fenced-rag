# 🔴 SECURITY: This file uses hardcoded credentials for local dev ONLY.
# In production, use docker-compose.prod.yml which requires env vars.
# NEVER commit this file with real credentials.

services:
  vector-db:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: rfr-vector-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      # ⚠ WARNING: Change this password before any non-local use.
      # Set via environment variable: POSTGRES_PASSWORD=<your-secure-password>
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: rag_internal
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_internal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rfr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
  redis_data:
