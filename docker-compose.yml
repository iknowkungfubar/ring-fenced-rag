# 🔴 SECURITY: Local development only.
# In production, set POSTGRES_PASSWORD via environment variable.
# NEVER commit real credentials here.
services:
  vector-db:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: rfr-vector-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      # ⚠ Change this password before any non-local use
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: rag_internal
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rag_internal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rfr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RFR_DB__URL: postgresql://admin:secure_password@vector-db:5432/rag_internal
      RFR_REDIS__URL: redis://redis:6379/0
    depends_on:
      vector-db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: src/rfr/web
      dockerfile: Dockerfile
    container_name: rfr-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgvector_data:
  redis_data:
