# Ring-Fenced RAG — Production Docker Compose
#
# 🔴 SECURITY NOTE: This file requires you to set environment variables.
# Never use default/fallback passwords in production.
#
# Start:   docker compose -f docker-compose.prod.yml up -d
# Stop:    docker compose -f docker-compose.prod.yml down
# Logs:    docker compose -f docker-compose.prod.yml logs -f
#
# Required environment variables:
#   RFR_DB_PASSWORD  — PostgreSQL password (no default — MUST be set)
#
# Optional environment variables:
#   RFR_DB__URL       — Full PostgreSQL connection string (overrides RFR_DB_USER/PASSWORD/NAME)
#   RFR_DB_USER       — PostgreSQL user (default: admin)
#   RFR_DB_NAME       — PostgreSQL database name (default: rag_internal)
#   RFR_LLM__PROVIDER — vllm, ollama, or openai
#   RFR_LLM__BASE_URL — LLM API endpoint
#   RFR_LLM__MODEL    — Model name
#   RFR_API_KEY       — Initial admin API key (auto-generated if empty)

services:
  # ── Vector Database ──
  vector-db:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: rfr-vector-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${RFR_DB_USER:-admin}
      # 🔴 REQUIRED: Set RFR_DB_PASSWORD in your environment
      POSTGRES_PASSWORD: ${RFR_DB_PASSWORD}
      POSTGRES_DB: ${RFR_DB_NAME:-rag_internal}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RFR_DB_USER:-admin} -d ${RFR_DB_NAME:-rag_internal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rfr-net

  # ── Redis (Celery broker) ──
  redis:
    image: redis:7-alpine
    container_name: rfr-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rfr-net

  # ── API Server ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 🔴 REQUIRED: Set RFR_DB_PASSWORD in your environment
      RFR_DB__URL: postgresql+psycopg://${RFR_DB_USER:-admin}:${RFR_DB_PASSWORD}@vector-db:5432/${RFR_DB_NAME:-rag_internal}
      RFR_REDIS__URL: redis://redis:6379/0
      RFR_LLM__PROVIDER: ${RFR_LLM_PROVIDER:-ollama}
      RFR_LLM__BASE_URL: ${RFR_LLM_BASE_URL:-http://llm:11434/v1}
      RFR_LLM__MODEL: ${RFR_LLM_MODEL:-llama3.2:3b}
      RFR_AUTH__ENABLED: "true"
      RFR_SERVER__LOG_LEVEL: INFO
      RFR_API_KEY: ${RFR_API_KEY:-}
    depends_on:
      vector-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rfr-net

  # ── Web UI ──
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: rfr-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rfr-net

  # ── Ingestion Worker (Celery) ──
  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rfr-ingestion
    restart: unless-stopped
    command: ["celery", "-A", "rfr.ingestion.tasks", "worker", "--loglevel=info"]
    environment:
      # 🔴 REQUIRED: Set RFR_DB_PASSWORD in your environment
      RFR_DB__URL: postgresql+psycopg://${RFR_DB_USER:-admin}:${RFR_DB_PASSWORD}@vector-db:5432/${RFR_DB_NAME:-rag_internal}
      RFR_REDIS__URL: redis://redis:6379/0
    depends_on:
      vector-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${RFR_DATA_DIR:-./data}
        target: /data
    networks:
      - rfr-net

  # ── LLM Provider (Ollama — uncomment for local inference) ──
  # llm:
  #   image: ollama/ollama:latest
  #   container_name: rfr-llm
  #   restart: unless-stopped
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     OLLAMA_KEEP_ALIVE: 5m
  #   networks:
  #     - rfr-net

volumes:
  pgvector_data:
  redis_data:
  ollama_data:

networks:
  rfr-net:
    driver: bridge
