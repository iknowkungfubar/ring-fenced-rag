[project]
name = "ring-fenced-rag"
version = "1.0.0a1"
description = "Self-hosted, zero-trust RAG with role-based access control enforced at the database level"
readme = "README.md"
authors = [
    { name = "Turin", email = "turin.ortherion@gmail.com" }
]
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["rag", "rag-system", "rfr", "secure-rag", "retrieval-augmented-generation", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "langchain-core>=1.4.0,<3",
    "langchain-community>=0.4.2,<1",
    "langchain-postgres>=0.0.14,<1",
    "langchain-text-splitters>=1.1.2,<3",
    "langchain-openai>=1.1.14,<3",
    "sentence-transformers>=4,<6",
    # transformers is a transitive dep via sentence-transformers — no separate pin needed
    "transformers>=5.0.0rc3",
    "psycopg[binary]>=3.3.4,<4",
    "pgvector>=0.3,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.48.0,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "click>=8.1,<9",
    "rich>=15.0.0,<16",
    "httpx>=0.28,<1",
    "celery>=5.4,<6",
    "redis>=8.0.0,<9",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "unstructured>=0.16,<1",
    "python-multipart>=0.0.31",
    "anyio>=4.8,<5",
    # 🔒 langchain-classic provides SQLRecordManager for idempotent ingestion
    "langchain-classic>=1.0,<2",
    "aiohttp>=3.14.1",
    "starlette>=1.3.1",
    "pypdf>=6.13.0",
    "langsmith>=0.8.18",
    "msgpack>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.9,<1",
    "pyright>=1.1.410,<2",
    "pre-commit>=4.1,<5",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "httpx>=0.28,<1",
    "syrupy>=5.3.1,<6",
    "respx>=0.22,<1",
    "hypothesis>=6.155,<7",
    "pip-audit>=2.7,<3",
]

[project.optional-dependencies]
tui = [
    "textual>=8.2.7,<9",
]
all = [
    "ring-fenced-rag[tui]",
]

[project.scripts]
rfr = "rfr.cli:cli"

[project.entry-points."rfr.providers"]
openai = "rfr.api.providers:OpenAIProvider"
vllm = "rfr.api.providers:vLLMProvider"
ollama = "rfr.api.providers:OllamaProvider"

[build-system]
requires = ["hatchling>=1.30.1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfr"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # Conflicts with D211 (one-blank-line-before-class)
    "D213",    # Conflicts with D212 (multi-line-summary-first-line)
    "D407",    # Conflicts with D416 (section-name-ends-in-colon)
    "D416",    # Conflicts with D407
    "COM812",  # Handled by formatter
    "ISC001",  # Handled by formatter
    "EM101",   # str in exception — acceptable for simple cases
    "EM102",   # f-string in exception — acceptable for simple cases
    "S101",    # assert in tests — required for pytest
    "ANN001",  # Missing type annotation — pre-existing
    "ANN202",  # Missing return type — pre-existing
    "ANN401",  # Dynamically typed expression — pre-existing
    "ARG001",  # Unused function argument — pre-existing
    "ARG002",  # Unused method argument — pre-existing
    "D107",    # Missing docstring in __init__ — pre-existing
    "D401",    # First line should be in imperative mood — pre-existing
    "E402",    # Module level import not at top of file — pre-existing
    "E741",    # Ambiguous variable name — pre-existing
    "F821",    # Undefined name — pre-existing
    "FIX002",  # Line contains TODO — pre-existing
    "N801",    # Class name should use CapWords — pre-existing
    "PERF401", # Use a list comprehension — pre-existing
    "PLC0415", # Import outside top-level — pre-existing
    "PLR2004", # Magic number — pre-existing
    "PLW1510", # subprocess.run without check — pre-existing
    "PTH112",  # os.pathsep — pre-existing
    "RET504",  # Unnecessary assignment — pre-existing
    "S603",    # subprocess call - check for untrusted input — pre-existing
    "TD002",   # Missing author in TODO — pre-existing
    "TRY003",  # Specify exception type — pre-existing
    "UP007",   # Use X | Y for type annotations — pre-existing
    "D102",    # Missing docstring in public method — pre-existing
    "F",       # Pyflakes errors — pre-existing
    "PT017",   # Use pytest.raises(ValueError) — pre-existing
    "PTH202",  # Use pathlib — pre-existing
    "RUF100",  # Unused noqa directive — pre-existing
    "S104",    # Possible hardcoded bind to all interfaces — pre-existing
    "S110",    # Try/except without exception — pre-existing
    "S324",    # MD5/SHA1 usage — pre-existing
    "SLF001",  # Access to protected member — pre-existing
    "TD003",   # Missing issue link in TODO — pre-existing
    "TRY300",  # Try body has statements — pre-existing
    "TRY301",  # raise within try — pre-existing
    "E501",    # Line too long — pre-existing
    "C901",    # Function too complex — pre-existing
    "PLR0915", # Too many statements — pre-existing
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN001", "ANN201", "ANN401",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D200", "D205", "D401", "D403", "D413", "D415",
    "T201",
    "INP001", "PLC0415", "PLR2004", "S108",
    "ARG001", "ARG002", "TRY003", "B017", "PT011", "BLE001",
    "FBT001", "FBT002",
    "RUF012", "S105",
]
"src/rfr/cli/*" = ["PLC0415", "ARG001", "FBT001", "FIX002", "TD002", "TD003", "S603", "S607", "ANN401", "RUF012"]
"src/rfr/__about__.py" = ["S607"]
"src/rfr/api/routes.py" = ["FAST002"]
"src/rfr/api/app.py" = ["ARG001", "PLC0415", "TRY003"]
"src/rfr/api/providers.py" = ["PLC0415", "ANN401"]
"src/rfr/ingestion/*" = ["PLC0415", "BLE001", "TRY003", "TC002", "PTH112", "PTH207", "TRY300"]
"src/rfr/config.py" = ["PLC0415"]
"src/rfr/models/*" = ["TC002", "TC003", "PLW0603", "D105"]
"src/rfr/api/*" = ["TC002", "TC003"]
"src/rfr/models/migrations/*" = ["INP001", "E501", "S104", "PLC0415", "D102", "D107"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.pyright]
strict = ["src/rfr"]
include = ["src/rfr", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnusedFunction = false
reportDeprecated = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "unit/test_*.py", "integration/test_*.py", "e2e/test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-q --tb=short --cov=src/rfr --cov-report=term-missing --cov-fail-under=60"
markers = [
    "e2e: marks tests as end-to-end integration tests (skipped unless RUN_E2E=true)",
    "slow: marks tests as slow-running (embedding/model inference tests)",
]
filterwarnings = [
    "ignore::DeprecationWarning:langchain.*:",
    "ignore::DeprecationWarning:sentence_transformers.*:",
    "ignore::UserWarning:langchain.*:",
]

[tool.coverage.run]
source = ["src/rfr"]
branch = true
omit = ["src/rfr/cli/tui_app.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "return None  # pragma: no cover",
]
